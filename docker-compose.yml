services:
  claude:
    build: .
    container_name: __PROJECT_NAME___claude
    volumes:
      # ssh keys and config for claude (Claude専用。権限の大きい鍵は置かない)
      - ./.ssh:/home/node/.ssh
      # claude config
      - claude-config:/home/node/.claude
      # project dir
      - ./__PROJECT_NAME__:/home/node/__PROJECT_NAME__
    environment:
      # enable color
      - TERM=xterm-256color
      # show times (e.g. status line's rate limit reset) in JST
      - TZ=Asia/Tokyo
    stdin_open: true
    tty: true
    command: sleep infinity

volumes:
  claude-config:
